name: Ubuntu build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build native Ubuntu target
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore Ubuntu solution
        run: dotnet restore src/Notepads.Ubuntu.sln

      - name: Build Ubuntu solution
        run: dotnet build src/Notepads.Ubuntu.sln --configuration Release --no-restore
